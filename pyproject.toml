[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagrams-editor"
version = "0.28.0"
description = "Diagram as Code — with interactive web editor and headless PNG export"
authors = [
    { name = "mingrammer", email = "mingrammer@gmail.com" },
    { name = "Tommaso Bersani", email = "tommasobersani@gmail.com" },
]
requires-python = "~=3.9"
readme = "README.md"
license = "MIT"
dependencies = [
    "graphviz>=0.13.2,<0.22.0",
    "jinja2>=2.10,<4.0",
    "flask>=2.0",
    "pillow>=10.0",
    "typed-ast>=1.5.5,<2 ; python_version<'3.8'",
]

[project.scripts]
diagrams = "diagrams.cli:main"

[project.urls]
Homepage = "https://github.com/tommasobersani/diagrams-editor"
Repository = "https://github.com/tommasobersani/diagrams-editor"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pylint>=3.3",
    "rope>=1.13",
    "isort>=6.0",
    "black>=24.4",
    "pre-commit>=4.0",
]

[tool.hatch.build]
only-include = ["diagrams", "resources"]

[tool.black]
line-length=120
